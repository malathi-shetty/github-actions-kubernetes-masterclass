name: CD (GitOps - manifest bump)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  bump-manifests:
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set variables
        run: |
          echo "SHA=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
          echo "SHORT_SHA=${{ github.event.workflow_run.head_sha }}" | cut -c1-7 >> $GITHUB_ENV

      - name: Pin backend + frontend images to commit SHA
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e

          echo "Updating images to SHA: $SHA"

          sed -i "s|image: .*skillpulse-backend:.*|image: ${DOCKER_USER}/skillpulse-backend:${SHA}|" k8s/20-backend.yaml
          sed -i "s|image: .*skillpulse-frontend:.*|image: ${DOCKER_USER}/skillpulse-frontend:${SHA}|" k8s/30-frontend.yaml

      - name: Verify Kubernetes manifests (dry-run)
        run: |
          echo "Validating Kubernetes YAML before commit..."
          # optional safety check (won't fail pipeline if kubectl missing in future)
          if command -v kubectl >/dev/null 2>&1; then
            kubectl apply --dry-run=client -f k8s/
          else
            echo "kubectl not installed in runner - skipping validation"
          fi

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add k8s/20-backend.yaml k8s/30-frontend.yaml
          git commit -m "deploy: pin images to ${SHORT_SHA}"
          git push
