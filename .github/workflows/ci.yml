name: CI-CD (Docker + GitOps Production Pipeline)

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

permissions:
  contents: write

jobs:

# =========================
# 1. SECURITY GATE (FAIL FAST)
# =========================
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---- Trivy (container + FS scan) ----
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1

      # ---- Gitleaks (secret detection) ----
      - name: Gitleaks Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/path \
            zricethezav/gitleaks:latest \
            detect \
            --source=/path \
            --exit-code 1 \
            --redact \
            --verbose

# =========================
# 2. BUILD + DOCKER PUSH
# =========================
  build:
    needs: security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---- Docker login ----
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Backend Image ----
      - name: Build & Push Backend
        run: |
          docker build -t $IMAGE_BACKEND:${{ github.sha }} ./backend
          docker tag $IMAGE_BACKEND:${{ github.sha }} $IMAGE_BACKEND:latest
          docker push $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:latest

      # ---- Frontend Image ----
      - name: Build & Push Frontend
        run: |
          docker build -t $IMAGE_FRONTEND:${{ github.sha }} ./frontend
          docker tag $IMAGE_FRONTEND:${{ github.sha }} $IMAGE_FRONTEND:latest
          docker push $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:latest

# =========================
# 3. PRODUCTION APPROVAL GATE
# =========================
  approval:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Manual Approval Gate
        run: echo "Approved for production deployment"

# =========================
# 4. GITOPS DEPLOY (ARGOCD READY)
# =========================
  gitops:
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: malathi-shetty/github-actions-kubernetes-masterclass
          token: ${{ secrets.GITOPS_TOKEN }}

      # ---- Kustomize Setup ----
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      # ---- Update Image Tags (GitOps Source of Truth) ----
      - name: Update Kubernetes Manifests
        run: |
          cd k8s/overlays/prod

          kustomize edit set image backend=$IMAGE_BACKEND:${{ github.sha }}
          kustomize edit set image frontend=$IMAGE_FRONTEND:${{ github.sha }}

      # ---- Commit back to GitOps repo ----
      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "🚀 release ${{ github.sha }} - prod deploy" || echo "No changes"
          git push
