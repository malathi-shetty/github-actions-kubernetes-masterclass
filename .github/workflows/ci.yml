name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

permissions:
  contents: write

# =========================================================
# 1. SECURITY GATE (BLOCK BAD CODE)
# =========================================================
jobs:

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------- TRIVY (BLOCK HIGH + CRITICAL) ----------------
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1   # 🔥 IMPORTANT: FAIL PIPELINE IF VULN FOUND

      # ---------------- GITLEAKS ----------------
      - name: Gitleaks Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/path \
          zricethezav/gitleaks:latest detect --source="/path"

# =========================================================
# 2. BUILD + PUSH IMAGES
# =========================================================
  build:
    needs: security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------- DOCKER LOGIN ----------------
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- BUILD + PUSH BACKEND ----------------
      - name: Build & Push Backend
        run: |
          docker build -t $IMAGE_BACKEND:${{ github.sha }} ./backend
          docker push $IMAGE_BACKEND:${{ github.sha }}

      # ---------------- BUILD + PUSH FRONTEND ----------------
      - name: Build & Push Frontend
        run: |
          docker build -t $IMAGE_FRONTEND:${{ github.sha }} ./frontend
          docker push $IMAGE_FRONTEND:${{ github.sha }}

# =========================================================
# 3. MANUAL APPROVAL (PRODUCTION GATE)
# =========================================================
  approval:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production   # 🔥 GitHub manual approval enabled here

    steps:
      - run: echo "Approved for production deployment"

# =========================================================
# 4. GITOPS DEPLOY (ARGOCD STYLE)
# =========================================================
  gitops:
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: malathi-shetty/github-actions-kubernetes-masterclass
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      # ---------------- FIX: NO CURL RATE LIMIT ----------------
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      # ---------------- UPDATE BACKEND IMAGE ----------------
      - name: Update Backend Image
        run: |
          cd k8s/overlays/prod
          kustomize edit set image backend=$IMAGE_BACKEND:${{ github.sha }}

      # ---------------- UPDATE FRONTEND IMAGE ----------------
      - name: Update Frontend Image
        run: |
          cd k8s/overlays/prod
          kustomize edit set image frontend=$IMAGE_FRONTEND:${{ github.sha }}

      # ---------------- COMMIT & PUSH ----------------
      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "release ${{ github.sha }}" || echo "no changes"
          git push
