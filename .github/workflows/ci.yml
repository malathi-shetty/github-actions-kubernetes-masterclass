name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      # Login first (needed for pull/tag consistency)
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- BUILD BACKEND ----------------
      - name: Build Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend-image:latest

      # 🛡️ TRIVY SCAN BACKEND (IMPORTANT)
      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-image:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # PUSH BACKEND (only after scan passes)
      - name: Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: shettymalathi113/skillpulse-backend:latest

      # ---------------- BUILD FRONTEND ----------------
      - name: Build Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: frontend-image:latest

      # 🛡️ TRIVY SCAN FRONTEND
      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-image:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # PUSH FRONTEND
      - name: Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: shettymalathi113/skillpulse-frontend:latest
