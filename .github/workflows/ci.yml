name: CI

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

# =========================
# SETUP BUILDX (FAST CACHE)
# =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

# =========================
# LOGIN
# =========================
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# =========================
# BACKEND BUILD (WITH GHA CACHE)
# =========================
      - name: Build Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: skillpulse-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =========================
# TRIVY BACKEND SCAN
# =========================
      - name: Trivy Scan Backend
        id: backend_scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skillpulse-backend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

# =========================
# PUSH BACKEND (ONLY IF CLEAN)
# =========================
      - name: Push Backend
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: shettymalathi113/skillpulse-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =========================
# FRONTEND BUILD (WITH GHA CACHE)
# =========================
      - name: Build Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: skillpulse-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =========================
# TRIVY FRONTEND SCAN
# =========================
      - name: Trivy Scan Frontend
        id: frontend_scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skillpulse-frontend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

# =========================
# PUSH FRONTEND (ONLY IF CLEAN)
# =========================
      - name: Push Frontend
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: shettymalathi113/skillpulse-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
