
name: CI

on:
  push:
    branches:
      - main

#concurrency:
  #group: production-deploy
  #cancel-in-progress: false

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

permissions:
  contents: write

jobs:

# =========================================================
# 1. DETECT SERVICES
# =========================================================
  detect-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Changed Services
        run: |
          echo "Detecting changed services..."
          echo "Backend + Frontend monitored"

# =========================================================
# 2. SECURITY SCAN
# =========================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: detect-services

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------- GITLEAKS ----------------
      - name: Gitleaks Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/path \
            zricethezav/gitleaks:latest detect \
            --source="/path" \
            --verbose

      # ---------------- TRIVY FS SCAN ----------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 0

      # ---------------- DOCKERFILE VALIDATION ----------------
      - name: Validate Dockerfiles
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          echo "Dockerfiles validated"

# =========================================================
# 3. BACKEND PIPELINE
# =========================================================
  backend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------- BUILDX ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------- LOGIN ----------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- BUILD ----------------
      - name: Build Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          provenance: false
          sbom: false
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- TRIVY IMAGE ----------------
      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      # ---------------- PUSH ----------------
      - name: Push Backend Image
        run: |
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:latest

          docker push $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:latest

# =========================================================
# 4. FRONTEND PIPELINE
# =========================================================
  frontend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------- BUILDX ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------- LOGIN ----------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- BUILD ----------------
      - name: Build Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          provenance: false
          sbom: false
          tags: frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------- TRIVY IMAGE ----------------
      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      # ---------------- PUSH ----------------
      - name: Push Frontend Image
        run: |
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:latest

          docker push $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:latest

# =========================================================
# 5. AIOPS REPORT
# =========================================================
  aiops-report:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Generate AIOps HTML Report
        run: |
          mkdir -p aiops/reports

          cat <<EOF > aiops/reports/report.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>AIOps Deployment Report</title>

            <style>
              body {
                background: #0f172a;
                color: white;
                font-family: Arial;
                padding: 40px;
              }

              .card {
                background: #1e293b;
                padding: 25px;
                margin-bottom: 20px;
                border-radius: 18px;
                box-shadow: 0 0 20px rgba(0,0,0,0.4);
              }

              h1 {
                color: #38bdf8;
              }

              .success {
                color: #22c55e;
                font-weight: bold;
              }

              .tag {
                background: #334155;
                padding: 10px;
                border-radius: 10px;
                margin-top: 10px;
                display: inline-block;
              }

              code {
                color: #facc15;
              }
            </style>
          </head>

          <body>

            <h1>🚀 SkillPulse AIOps Deployment Report</h1>

            <div class="card">
              <h2>📦 Deployment Details</h2>

              <p><b>Commit SHA</b></p>
              <div class="tag">
                <code>$GITHUB_SHA</code>
              </div>

              <p><b>Actor:</b> $GITHUB_ACTOR</p>
              <p><b>Branch:</b> $GITHUB_REF_NAME</p>
            </div>

            <div class="card">
              <h2>🐳 Docker Images</h2>

              <p><b>Backend</b></p>
              <div class="tag">
                $IMAGE_BACKEND:$GITHUB_SHA
              </div>

              <p><b>Frontend</b></p>
              <div class="tag">
                $IMAGE_FRONTEND:$GITHUB_SHA
              </div>
            </div>

            <div class="card">
              <h2>✅ Pipeline Status</h2>

              <p class="success">✔ Security Scan Passed</p>
              <p class="success">✔ Backend Build Passed</p>
              <p class="success">✔ Frontend Build Passed</p>
            </div>

            <div class="card">
              <h2>⏰ Timestamp</h2>

              <p>$(date)</p>
            </div>

          </body>
          </html>
          EOF

      # ---------------- UPLOAD REPORT ----------------
      - name: Upload AIOps Report
        uses: actions/upload-artifact@v4
        with:
          name: aiops-report
          path: aiops/reports/report.html

# =========================================================
# 6. APPROVAL GATE
# =========================================================
  approval:
    runs-on: ubuntu-latest
    needs: aiops-report

    environment:
      name: production

    steps:
      - name: Production Approval
        run: echo "Approved for production deployment"

# =========================================================
# 7. GITOPS DEPLOYMENT
# =========================================================
  gitops:
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

      # ---------------- KUSTOMIZE ----------------
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      # ---------------- UPDATE MANIFESTS ----------------
      - name: Update Kubernetes Manifests
        run: |
          cd k8s/overlays/prod

          kustomize edit set image backend=$IMAGE_BACKEND:${{ github.sha }}
          kustomize edit set image frontend=$IMAGE_FRONTEND:${{ github.sha }}

      # ---------------- COMMIT & PUSH ----------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git reset --hard origin/main

          cd k8s/overlays/prod

          kustomize edit set image backend=$IMAGE_BACKEND:${{ github.sha }}
          kustomize edit set image frontend=$IMAGE_FRONTEND:${{ github.sha }}

          cd ../../..

          git add .

          git commit -m "🚀 release $GITHUB_SHA - prod deploy [skip ci]" || echo "No changes"

          git push origin HEAD:main

# =========================================================
# 8. DEPLOY DASHBOARD
# =========================================================
  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: gitops

    steps:
      - name: Download AIOps Report
        uses: actions/download-artifact@v4
        with:
          name: aiops-report
          path: aiops/downloaded

      - name: Deploy Dashboard to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "aiops/downloaded/*"
          target: "/var/www/aiops/"

