name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# ================= BUILDX =================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# ================= BACKEND BUILD =================
      - name: Build Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ================= BACKEND SCAN =================
      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

# ================= BACKEND PUSH =================
      - name: Push Backend
        run: |
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:${{ github.sha }}

# ================= FRONTEND BUILD =================
      - name: Build Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ================= FRONTEND SCAN =================
      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

# ================= FRONTEND PUSH =================
      - name: Push Frontend
        run: |
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:${{ github.sha }}

# ================= AIOPS REPORT =================
      - name: Generate AIOps Report
        if: always()
        run: |
          mkdir -p aiops/reports

          echo "# AIOps Report" > aiops/reports/report.md
          echo "Commit: $GITHUB_SHA" >> aiops/reports/report.md
          echo "Actor: $GITHUB_ACTOR" >> aiops/reports/report.md
          echo "Backend: $IMAGE_BACKEND:${{ github.sha }}" >> aiops/reports/report.md
          echo "Frontend: $IMAGE_FRONTEND:${{ github.sha }}" >> aiops/reports/report.md
          echo "Status: CI Completed" >> aiops/reports/report.md

# ================= UPLOAD REPORT =================
      - name: Upload AIOps Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-report
          path: aiops/reports/report.md

# ================= DEPLOY DASHBOARD =================
      - name: Deploy AIOps Dashboard
        if: always()
        run: |
          echo "Deploying AIOps dashboard to EC2..."

          scp -o StrictHostKeyChecking=no -r aiops/dashboard/* \
          ubuntu@${{ secrets.EC2_HOST }}:/var/www/aiops/
