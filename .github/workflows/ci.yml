name: CI

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

# =========================
# DOCKER BUILDX + CACHE
# =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# =========================
# BACKEND BUILD (ONCE)
# =========================
      - name: Build Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: skillpulse-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =========================
# BACKEND TRIVY SCAN
# =========================
      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skillpulse-backend:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

# =========================
# PUSH BACKEND (NO REBUILD)
# =========================
      - name: Push Backend Image
        run: |
          docker tag skillpulse-backend:ci ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest

# =========================
# FRONTEND BUILD (ONCE)
# =========================
      - name: Build Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: skillpulse-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =========================
# FRONTEND TRIVY SCAN
# =========================
      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skillpulse-frontend:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

# =========================
# PUSH FRONTEND (NO REBUILD)
# =========================
      - name: Push Frontend Image
        run: |
          docker tag skillpulse-frontend:ci ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest
