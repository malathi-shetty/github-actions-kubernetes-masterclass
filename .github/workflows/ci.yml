name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------- BUILD BACKEND ----------------
      - name: Build Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend-image:latest

      # 🛡️ TRIVY BACKEND (LOCAL IMAGE)
      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-image:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      # PUSH BACKEND
      - name: Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: shettymalathi113/skillpulse-backend:latest

      # ---------------- BUILD FRONTEND ----------------
      - name: Build Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: frontend-image:latest

      # 🛡️ TRIVY FRONTEND (LOCAL IMAGE)
      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-image:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      # PUSH FRONTEND
      - name: Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: shettymalathi113/skillpulse-frontend:latest

      # ---------------- TRIVY REPORT ----------------
      - name: Generate Trivy Report
        run: trivy image backend-image:latest --format json -o report.json

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: report.json
