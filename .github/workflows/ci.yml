name: CI

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-west-2
  AWS_DEFAULT_REGION: us-west-2
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

jobs:

# =========================================================
# DETECT SERVICES
# =========================================================
  detect-services:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect Changed Services
        run: |
          echo "Detecting changed services..."
          echo "Backend + Frontend monitored"

# =========================================================
# SECURITY SCAN
# =========================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: detect-services

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# ---------------- GITLEAKS ----------------
      - name: Gitleaks Scan
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/path \
          zricethezav/gitleaks:latest detect \
          --source="/path" \
          --verbose

# ---------------- DOCKERFILE CHECK ----------------
      - name: Dockerfile Validation
        run: |
          echo "Validating Dockerfiles..."

          test -f backend/Dockerfile
          test -f frontend/Dockerfile

          echo "Dockerfiles exist"

# =========================================================
# BACKEND PIPELINE
# =========================================================
  backend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# ---------------- BUILDX ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

# ---------------- LOGIN ----------------
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# ---------------- BUILD ----------------
      - name: Build Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------- TRIVY ----------------
      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

# ---------------- PUSH ----------------
      - name: Push Backend
        run: |
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:${{ github.sha }}

# =========================================================
# FRONTEND PIPELINE
# =========================================================
  frontend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# ---------------- BUILDX ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

# ---------------- LOGIN ----------------
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# ---------------- BUILD ----------------
      - name: Build Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------- TRIVY ----------------
      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

# ---------------- PUSH ----------------
      - name: Push Frontend
        run: |
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:${{ github.sha }}

# =========================================================
# AIOPS REPORT
# =========================================================
  aiops-report:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Generate AIOps Report
        run: |
          mkdir -p aiops/reports

          echo "# AIOps Report" > aiops/reports/report.md
          echo "Commit: $GITHUB_SHA" >> aiops/reports/report.md
          echo "Actor: $GITHUB_ACTOR" >> aiops/reports/report.md
          echo "Backend: $IMAGE_BACKEND:${{ github.sha }}" >> aiops/reports/report.md
          echo "Frontend: $IMAGE_FRONTEND:${{ github.sha }}" >> aiops/reports/report.md
          echo "Status: CI Completed" >> aiops/reports/report.md

# ---------------- UPLOAD REPORT ----------------
      - name: Upload AIOps Report
        uses: actions/upload-artifact@v4
        with:
          name: aiops-report
          path: aiops/reports/report.md

# =========================================================
# DEPLOY DASHBOARD
# =========================================================
  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: aiops-report

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy AIOps Dashboard
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "aiops/dashboard/*"
          target: "/var/www/aiops/"
