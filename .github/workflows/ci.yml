name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

jobs:

# =========================================================
# BUILD BACKEND
# =========================================================
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build -t backend:${{ github.sha }} ./backend
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:${{ github.sha }}

# =========================================================
# BUILD FRONTEND
# =========================================================
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend
        run: |
          docker build -t frontend:${{ github.sha }} ./frontend
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:${{ github.sha }}

# =========================================================
# UPDATE GITOPS
# =========================================================
  gitops:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: malathi-shetty/github-actions-kubernetes-masterclass
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Backend Image
        run: |
          cd k8s/overlays/dev
          kustomize edit set image skillpulse-backend=${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:${{ github.sha }}

      - name: Update Frontend Image
        run: |
          cd k8s/overlays/dev
          kustomize edit set image skillpulse-frontend=${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:${{ github.sha }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "update images ${{ github.sha }}" || echo "no changes"
          git push origin main
