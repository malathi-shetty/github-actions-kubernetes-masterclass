name: CI

on:
  push:
    branches: [main]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

# =========================
# DOCKER CACHE (IMPORTANT)
# =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

# =========================
# LOGIN
# =========================
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# =========================
# BACKEND BUILD
# =========================
      - name: Build Backend Image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: skillpulse-backend:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache (backend)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

# =========================
# TRIVY CACHE (IMPORTANT)
# =========================
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            trivy-db-

# =========================
# TRIVY BACKEND SCAN
# =========================
      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skillpulse-backend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

# =========================
# PUSH BACKEND
# =========================
      - name: Push Backend
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: shettymalathi113/skillpulse-backend:latest

# =========================
# FRONTEND BUILD
# =========================
      - name: Build Frontend Image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: skillpulse-frontend:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache (frontend)
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

# =========================
# TRIVY FRONTEND SCAN
# =========================
      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skillpulse-frontend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

# =========================
# PUSH FRONTEND
# =========================
      - name: Push Frontend
        if: success()
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: shettymalathi113/skillpulse-frontend:latest
