name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

jobs:

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build -t backend:${{ github.sha }} ./backend
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend
        run: |
          docker build -t frontend:${{ github.sha }} ./frontend
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:${{ github.sha }}

  update-gitops:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          repository: YOUR_GITHUB_USERNAME/skillpulse-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update image tags (DEV)
        run: |
          sed -i "s|image: .*backend.*|image: $IMAGE_BACKEND:${{ github.sha }}|g" k8s/overlays/dev/backend.yaml
          sed -i "s|image: .*frontend.*|image: $IMAGE_FRONTEND:${{ github.sha }}|g" k8s/overlays/dev/frontend.yaml

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "update images ${{ github.sha }}" || echo "No changes"
          git push
