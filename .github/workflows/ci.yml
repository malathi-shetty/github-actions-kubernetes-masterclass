name: CI

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-west-2
  AWS_DEFAULT_REGION: us-west-2
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

jobs:

# =========================================================
# DETECT SERVICES
# =========================================================
  detect-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Changed Services
        run: |
          echo "Detecting changes..."

# =========================================================
# SECURITY SCAN
# =========================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: detect-services

    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/path \
          zricethezav/gitleaks:latest detect --source="/path"

# =========================================================
# BACKEND BUILD + PUSH
# =========================================================
  backend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend
        run: |
          docker build -t backend:${{ github.sha }} ./backend

      - name: Push Backend
        run: |
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:${{ github.sha }}

# =========================================================
# FRONTEND BUILD + PUSH
# =========================================================
  frontend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend
        run: |
          docker build -t frontend:${{ github.sha }} ./frontend

      - name: Push Frontend
        run: |
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:${{ github.sha }}

# =========================================================
# UPDATE GITOPS (THIS IS THE KEY FIX)
# =========================================================
  update-gitops:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Update Backend Image
        run: |
          sed -i "s|image: .*skillpulse-backend.*|image: $IMAGE_BACKEND:${{ github.sha }}|g" k8s/overlays/dev/deployment.yaml

      - name: Update Frontend Image
        run: |
          sed -i "s|image: .*skillpulse-frontend.*|image: $IMAGE_FRONTEND:${{ github.sha }}|g" k8s/overlays/dev/deployment.yaml

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/overlays/dev/deployment.yaml
          git commit -m "GitOps update: image ${{ github.sha }}" || echo "No changes"
          git push

# =========================================================
# OPTIONAL REPORT
# =========================================================
  aiops-report:
    runs-on: ubuntu-latest
    needs: update-gitops

    steps:
      - name: Generate report
        run: |
          mkdir -p aiops/reports
          echo "CI Completed ${{ github.sha }}" > aiops/reports/report.md
