name: CI

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false
  
env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

permissions:
  contents: write

jobs:

# =========================================================
# 1. DETECT SERVICES
# =========================================================
  detect-services:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect Changed Services
        run: |
          echo "Detecting changed services..."
          echo "Backend + Frontend monitored"

# =========================================================
# 2. SECURITY SCAN
# =========================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: detect-services

    steps:
      - uses: actions/checkout@v4

# ---------------- GITLEAKS ----------------
      - name: Gitleaks Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/path \
            zricethezav/gitleaks:latest detect \
            --source="/path" \
            --verbose

# ---------------- TRIVY FILESYSTEM ----------------
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 0

# ---------------- DOCKERFILE CHECK ----------------
      - name: Validate Dockerfiles
        run: |
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          echo "Dockerfiles validated"

# =========================================================
# 3. BACKEND PIPELINE
# =========================================================
  backend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

# ---------------- BUILDX ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

# ---------------- LOGIN ----------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# ---------------- BUILD ----------------
      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------- TRIVY IMAGE ----------------
      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

# ---------------- PUSH ----------------
      - name: Push Backend Image
        run: |
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:latest

          docker push $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:latest

# =========================================================
# 4. FRONTEND PIPELINE
# =========================================================
  frontend:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4

# ---------------- BUILDX ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

# ---------------- LOGIN ----------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# ---------------- BUILD ----------------
      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ---------------- TRIVY IMAGE ----------------
      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

# ---------------- PUSH ----------------
      - name: Push Frontend Image
        run: |
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:latest

          docker push $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:latest

# =========================================================
# 5. AIOPS REPORT
# =========================================================
  aiops-report:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

# ---------------- GENERATE REPORT ----------------
      - name: Generate AIOps Report
        run: |
          mkdir -p aiops/reports

          cat <<EOF > aiops/reports/report.md
          # AIOps Deployment Report

          ## Deployment Details
          - Commit SHA: $GITHUB_SHA
          - Triggered By: $GITHUB_ACTOR
          - Branch: $GITHUB_REF_NAME

          ## Docker Images
          - Backend: $IMAGE_BACKEND:${{ github.sha }}
          - Frontend: $IMAGE_FRONTEND:${{ github.sha }}

          ## Pipeline Status
          - Security Scan: PASSED
          - Backend Build: PASSED
          - Frontend Build: PASSED

          ## Timestamp
          $(date)
          EOF

# ---------------- UPLOAD ARTIFACT ----------------
      - name: Upload AIOps Report
        uses: actions/upload-artifact@v4
        with:
          name: aiops-report
          path: aiops/reports/report.md

# =========================================================
# 6. PRODUCTION APPROVAL
# =========================================================
  approval:
    runs-on: ubuntu-latest
    needs: aiops-report

  #  environment:
  #    name: production

    steps:
      - name: Approval Gate
        run: echo "Approved for Production"

# =========================================================
# 7. GITOPS DEPLOYMENT
# =========================================================
  gitops:
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

# ---------------- KUSTOMIZE ----------------
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

# ---------------- UPDATE MANIFESTS ----------------
      - name: Update Kubernetes Manifests
        run: |
          cd k8s/overlays/prod

          kustomize edit set image backend=$IMAGE_BACKEND:${{ github.sha }}
          kustomize edit set image frontend=$IMAGE_FRONTEND:${{ github.sha }}

# ---------------- PUSH WITH RETRY ----------------
      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git reset --hard origin/main

          cd k8s/overlays/prod

          kustomize edit set image backend=$IMAGE_BACKEND:${{ github.sha }}
          kustomize edit set image frontend=$IMAGE_FRONTEND:${{ github.sha }}
          cd ../../..
          git add .

          git commit -m "🚀 release $GITHUB_SHA - prod deploy" || echo "No changes"

          git pull --rebase origin main || true

          git push origin HEAD:main

# =========================================================
# 8. DEPLOY DASHBOARD
# =========================================================
  deploy-dashboard:
    runs-on: ubuntu-latest
    needs: gitops

    steps:
      - uses: actions/checkout@v4

# ---------------- DOWNLOAD REPORT ----------------
      - name: Download AIOps Report
        uses: actions/download-artifact@v4
        with:
          name: aiops-report
          path: aiops/downloaded

# ---------------- COPY DASHBOARD ----------------
      - name: Deploy Dashboard to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "aiops/*"
          target: "/var/www/aiops/"
