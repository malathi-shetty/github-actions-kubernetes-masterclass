name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

permissions:
  contents: write

# =========================================================
# 1. SECURITY GATE (BLOCK BAD CODE)
# =========================================================
jobs:

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS Scan (BLOCK HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Gitleaks Scan
        run: |
          docker run --rm -v ${{ github.workspace }}:/path \
          zricethezav/gitleaks:latest detect --source="/path"

# =========================================================
# 2. BUILD + PUSH IMAGES
# =========================================================
  build:
    needs: security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build -t $IMAGE_BACKEND:${{ github.sha }} ./backend
          docker push $IMAGE_BACKEND:${{ github.sha }}

      - name: Build & Push Frontend
        run: |
          docker build -t $IMAGE_FRONTEND:${{ github.sha }} ./frontend
          docker push $IMAGE_FRONTEND:${{ github.sha }}

# =========================================================
# 3. MANUAL APPROVAL (PRODUCTION GATE)
# =========================================================
  approval:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production   # 🔥 GitHub ENV approval happens here

    steps:
      - run: echo "Approved for production deploy"

# =========================================================
# 4. GITOPS DEPLOY (ARGOCD STYLE)
# =========================================================
  gitops:
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: malathi-shetty/github-actions-kubernetes-masterclass
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Backend Image
        run: |
          cd k8s/overlays/prod
          kustomize edit set image backend=$IMAGE_BACKEND:${{ github.sha }}

      - name: Update Frontend Image
        run: |
          cd k8s/overlays/prod
          kustomize edit set image frontend=$IMAGE_FRONTEND:${{ github.sha }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "release ${{ github.sha }}" || echo "no changes"
          git push
