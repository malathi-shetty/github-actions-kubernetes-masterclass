name: CI

on:
  push:
    branches: [main]

env:
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# ================= BACKEND =================
      - name: Build Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push Backend
        run: |
          docker tag backend:${{ github.sha }} $IMAGE_BACKEND:${{ github.sha }}
          docker push $IMAGE_BACKEND:${{ github.sha }}

# ================= FRONTEND =================
      - name: Build Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push Frontend
        run: |
          docker tag frontend:${{ github.sha }} $IMAGE_FRONTEND:${{ github.sha }}
          docker push $IMAGE_FRONTEND:${{ github.sha }}

# ================= AIOPS REPORT =================
      - name: Generate AIOps Report
        if: always()
        run: |
          mkdir -p aiops/reports
          cat > aiops/reports/report.md <<EOF
# AIOps Report

Commit: $GITHUB_SHA
Actor: $GITHUB_ACTOR

Backend: $IMAGE_BACKEND:${{ github.sha }}
Frontend: $IMAGE_FRONTEND:${{ github.sha }}

Status: CI Completed
EOF

      - name: Upload AIOps Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-report
          path: aiops/reports/report.md

# ================= SLACK =================
      - name: Slack Notify
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "CI-AIOps Result"
          SLACK_MESSAGE: "Pipeline finished for ${{ github.sha }}"
