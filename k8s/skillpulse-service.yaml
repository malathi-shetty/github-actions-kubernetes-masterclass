# =========================================
# SkillPulse UI Service
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: skillpulse-ui
spec:
  type: LoadBalancer
  selector:
    app: skillpulse
  ports:
    - port: 8888
      targetPort: 8888

# =========================================
# Grafana
# =========================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 8080
      targetPort: 3000

# =========================================
# Grafana
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 8080
      targetPort: 3000


# =========================================
# Prometheus
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090


# =========================================
# ArgoCD
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: argocd-server
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - port: 8081
      targetPort: 8080

