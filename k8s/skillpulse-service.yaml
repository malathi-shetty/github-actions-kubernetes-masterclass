# =========================================
# FRONTEND DEPLOYMENT
# =========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: skillpulse-prod
  labels:
    app: frontend
    env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: shettymalathi113/skillpulse-frontend:latest
          ports:
            - containerPort: 80

---
# FRONTEND SERVICE (INTERNAL ONLY)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: skillpulse-prod
  labels:
    app: frontend
    env: prod 
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

---
# =========================================
# BACKEND DEPLOYMENT
# =========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: skillpulse-prod
  labels:
    app: backend
    env: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: shettymalathi113/skillpulse-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: PORT
              value: "8080"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: skillpulse-db
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skillpulse-db
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: skillpulse-db
                  key: MYSQL_DATABASE

---
# BACKEND SERVICE (INTERNAL ONLY)
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: skillpulse-prod
  labels:
    app: backend
    env: prod
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
