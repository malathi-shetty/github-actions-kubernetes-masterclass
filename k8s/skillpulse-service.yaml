# =========================================
# SkillPulse UI Service
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: skillpulse-ui
spec:
  type: LoadBalancer
  selector:
    app: skillpulse
  ports:
    - name: http
      port: 8888
      targetPort: 8888

---
# =========================================
# Grafana Service
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      port: 8080
      targetPort: 3000

---
# =========================================
# Prometheus Service
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090

---
# =========================================
# AIOps UI Service
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: aiops-ui
spec:
  type: LoadBalancer
  selector:
    app: aiops
  ports:
    - name: http
      port: 8090
      targetPort: 8090

---
# =========================================
# ArgoCD Service
# =========================================

apiVersion: v1
kind: Service
metadata:
  name: argocd-server
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 8081
      targetPort: 8080
