apiVersion: v1
kind: Secret
metadata:
  name: skillpulse-db
  namespace: skillpulse-prod

type: Opaque

stringData:
  MYSQL_ROOT_PASSWORD: rootpassword123
  MYSQL_DATABASE: skillpulse
  MYSQL_USER: skillpulse
  MYSQL_PASSWORD: skillpulse123

---
# =========================================
# MYSQL INIT SQL
# =========================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: mysql-init
  namespace: skillpulse-prod

data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS skillpulse;
    USE skillpulse;

    CREATE TABLE IF NOT EXISTS skills (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        category VARCHAR(50) DEFAULT '',
        target_hours INT DEFAULT 0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

---
# =========================================
# MYSQL SERVICE
# =========================================

apiVersion: v1
kind: Service

metadata:
  name: mysql
  namespace: skillpulse-prod

spec:
  selector:
    app: mysql

  ports:
    - port: 3306
      targetPort: 3306

---
# =========================================
# MYSQL STATEFULSET
# =========================================

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql
  namespace: skillpulse-prod

spec:
  serviceName: mysql

  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8

          ports:
            - containerPort: 3306

          envFrom:
            - secretRef:
                name: skillpulse-db

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

            - name: init-script
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: mysql-storage
          emptyDir: {}

        - name: init-script
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: skillpulse-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
