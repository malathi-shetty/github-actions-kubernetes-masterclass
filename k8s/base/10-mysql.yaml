apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: skillpulse-prod
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: password
  MYSQL_DATABASE: skillpulse
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: skillpulse-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: skillpulse-prod

spec:
  selector:
    app: mysql

  ports:
    - port: 3306
      targetPort: 3306
