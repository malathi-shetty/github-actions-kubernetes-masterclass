apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: skillpulse-prod
  labels:
    app: frontend
    env: prod

spec:
  type: ClusterIP
  selector:
    app: frontend
    env: prod

  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: skillpulse-prod
  labels:
    app: frontend
    env: prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend
      env: prod

  template:
    metadata:
      labels:
        app: frontend
        env: prod

    spec:
      containers:
        - name: frontend
          image: shettymalathi113/skillpulse-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
