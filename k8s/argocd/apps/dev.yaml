apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: skillpulse-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/malathi-shetty/github-actions-kubernetes-masterclass.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: skillpulse-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
