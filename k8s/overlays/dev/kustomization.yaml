apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-dev

commonLabels:
  env: dev

resources:
  - ../../base

images:
  - name: skillpulse-backend
    newName: shettymalathi113/skillpulse-backend
    newTag: ab5ad4c0fc3c4d85dabb011fa05b0a59fd5b6150

  - name: skillpulse-frontend
    newName: shettymalathi113/skillpulse-frontend
    newTag: ab5ad4c0fc3c4d85dabb011fa05b0a59fd5b6150

patches:
  - target:
      kind: Rollout
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
