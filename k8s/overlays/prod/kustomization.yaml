apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: 006ece3be256197f541c70ac55e3aa93bbe23abd
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: 006ece3be256197f541c70ac55e3aa93bbe23abd
