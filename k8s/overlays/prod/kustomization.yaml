apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: 7cd9efb3a01c6fe6b061958740a03aa6bf7fbf52
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: 7cd9efb3a01c6fe6b061958740a03aa6bf7fbf52
