apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: ebcf6c9e15a321bb63bf6b4d87f5fef08b3dc334
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: ebcf6c9e15a321bb63bf6b4d87f5fef08b3dc334
