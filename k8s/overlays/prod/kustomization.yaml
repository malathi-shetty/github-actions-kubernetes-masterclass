apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: c94b71d89b61150df3d25329dac2fdac900aad71
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: c94b71d89b61150df3d25329dac2fdac900aad71
