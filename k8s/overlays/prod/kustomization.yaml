apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

labels:
  - pairs:
      env: prod

resources:
  - ../../base
  - ingress.yaml

patches:
  - target:
      kind: Rollout
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

images:
  - name: shettymalathi113/skillpulse-backend
    newName: shettymalathi113/skillpulse-backend
    newTag: e98b107eb413f249e0df9e149524ea738e66159a

  - name: shettymalathi113/skillpulse-frontend
    newName: shettymalathi113/skillpulse-frontend
    newTag: e98b107eb413f249e0df9e149524ea738e66159a
