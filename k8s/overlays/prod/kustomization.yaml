apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: 2e5839e4bf830b118634de0562e2261483f0e003
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: 2e5839e4bf830b118634de0562e2261483f0e003
