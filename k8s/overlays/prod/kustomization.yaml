apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: f38ab17877066964307e58b1823187c97c0d2ea4
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: f38ab17877066964307e58b1823187c97c0d2ea4
