apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: 6ab528f24f555f6cf8adbe32f5b1e58ca0e03cec
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: 6ab528f24f555f6cf8adbe32f5b1e58ca0e03cec
