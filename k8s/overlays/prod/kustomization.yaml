apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod
commonLabels:
  env: prod
  
resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: e98b107eb413f249e0df9e149524ea738e66159a
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: e98b107eb413f249e0df9e149524ea738e66159a
