apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: 2362b64a9ecbfe7d97c8b0c65ca838e50229a812
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: 2362b64a9ecbfe7d97c8b0c65ca838e50229a812
