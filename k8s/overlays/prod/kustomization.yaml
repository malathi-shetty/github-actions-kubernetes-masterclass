apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: 6ebf71c08f284bdb949c36f17a0fd5a907177585
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: 6ebf71c08f284bdb949c36f17a0fd5a907177585
