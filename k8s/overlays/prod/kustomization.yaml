apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: ed69cd9aa04aa4eb4734f20011526f3e7dd80d9b
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: ed69cd9aa04aa4eb4734f20011526f3e7dd80d9b
