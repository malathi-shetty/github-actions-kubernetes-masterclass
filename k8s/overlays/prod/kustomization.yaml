apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: c3a236fdbb2f0e934d284cf60441b046c4499441
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: c3a236fdbb2f0e934d284cf60441b046c4499441
