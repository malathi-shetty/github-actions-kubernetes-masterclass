apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: 642e06106cb6d5c5b6da4e3c4429ed0bd82a8f4b
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: 642e06106cb6d5c5b6da4e3c4429ed0bd82a8f4b
