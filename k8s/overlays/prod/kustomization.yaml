apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-prod

resources:
- ../../base
- ingress.yaml

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
images:
- name: backend
  newName: shettymalathi113/skillpulse-backend
  newTag: fdc0c17c6f5cf6f3b930cb55142b0febfd63e5f2
- name: frontend
  newName: shettymalathi113/skillpulse-frontend
  newTag: fdc0c17c6f5cf6f3b930cb55142b0febfd63e5f2
