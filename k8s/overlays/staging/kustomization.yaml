apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillpulse-staging

labels:
  - pairs:
      env: staging

resources:
  - ../../base

patches:
  - target:
      kind: Rollout
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
